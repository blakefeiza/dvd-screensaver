<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DVD Screensaver</title>
    <script src="shim.js"></script>
    <script src="main.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
      #foot { position: fixed; left: 0; right: 0; bottom: 6px; text-align: center; font: 11px Arial, sans-serif; color: rgba(255,255,255,.55); pointer-events: none; padding: 0 12px; }
      #foot b { color: rgba(255,255,255,.8); font-weight: 700; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="foot"><span>Viz by <b>Blake Feiza</b> &nbsp;·&nbsp; Data: Sample - Superstore (Tableau)</span></div>
  </body>
</html>
